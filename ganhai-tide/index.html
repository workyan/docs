<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>赶海-潮汐表</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #12202a;
      --muted: #5b6872;
      --line: #d5e0e8;
      --brand: #0f6b78;
      --bg: #f4f8fb;
      --panel: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #edf6fb 0%, var(--bg) 100%);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0 72px;
    }

    header {
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1.08;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    p {
      margin: 0 0 14px;
    }

    a {
      color: var(--brand);
      font-weight: 700;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .muted {
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
      margin-top: 26px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 20px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>赶海-潮汐表</h1>
      <p class="muted">离线潮汐表与赶海提醒工具，面向 iPhone 和 iPad。</p>
    </header>

    <p>应用提供热门海湾的离线潮汐数据、今日赶海窗口、地点收藏和本地提醒，帮助你在没有网络时也能快速判断几点适合出发。</p>

    <div class="grid">
      <section class="card">
        <h2>隐私政策</h2>
        <p class="muted">查看应用会处理哪些数据，以及数据保存方式。</p>
        <a href="./privacy.html">打开隐私政策</a>
      </section>
      <section class="card">
        <h2>支持页面</h2>
        <p class="muted">查看常见问题、问题反馈方式和审核说明。</p>
        <a href="./support.html">打开支持页面</a>
      </section>
    </div>
  </main>
</body>
</html>
