<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>交易日记-股票复盘</title>
  <meta name="description" content="交易日记-股票复盘的隐私政策与支持页面。">
  <style>
    :root {
      color-scheme: light;
      --ink: #1f1b16;
      --muted: #62584c;
      --line: #e4d9cb;
      --brand: #8a4b14;
      --bg: #fbf7f1;
      --panel: #fffdf9;
      --accent: #f3e2cb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
      background:
        radial-gradient(circle at top left, #fff4e4 0, transparent 34%),
        linear-gradient(180deg, #f7efe3 0%, var(--bg) 32%, var(--bg) 100%);
    }

    main {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0 72px;
    }

    header {
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(34px, 7vw, 60px);
      line-height: 1.08;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    p {
      margin: 0 0 14px;
    }

    a {
      color: var(--brand);
      font-weight: 700;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .muted {
      color: var(--muted);
    }

    .hero {
      background: rgba(255, 253, 249, 0.92);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: clamp(24px, 5vw, 40px);
      box-shadow: 0 10px 30px rgba(138, 75, 20, 0.08);
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 14px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--brand);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
      margin-top: 24px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
    }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <p class="eyebrow">TradeNote-Review / 交易日记-股票复盘</p>
      <h1>本地优先的交易记录与复盘工具</h1>
      <p class="muted">用于记录每一笔交易的计划、执行、情绪与复盘结论，帮助个人投资者形成长期可回看的交易纪律系统。</p>
    </header>

    <div class="grid">
      <section class="card">
        <h2>隐私政策</h2>
        <p class="muted">查看应用如何处理交易记录、截图附件和本地导出数据。</p>
        <a href="./privacy.html">打开隐私政策</a>
      </section>
      <section class="card">
        <h2>支持页面</h2>
        <p class="muted">查看常见问题、问题反馈方式和 App Store 审核说明。</p>
        <a href="./support.html">打开支持页面</a>
      </section>
    </div>
  </main>
</body>
</html>
