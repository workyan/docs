<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contraction-Watch</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c2430;
      --muted: #627081;
      --line: #d9e2ec;
      --brand: #0f766e;
      --bg: radial-gradient(circle at top, #ecfbf7 0%, #f7fbfa 48%, #ffffff 100%);
      --panel: rgba(255, 255, 255, 0.92);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(760px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: clamp(24px, 6vw, 44px);
      box-shadow: 0 18px 50px rgba(12, 42, 36, 0.08);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(32px, 7vw, 50px);
      line-height: 1.08;
    }

    p {
      line-height: 1.7;
      font-size: 17px;
    }

    .muted {
      color: var(--muted);
    }

    .links {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    a.button {
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 999px;
      border: 1px solid var(--brand);
      color: white;
      background: var(--brand);
      font-weight: 700;
    }

    a.secondary {
      background: white;
      color: var(--brand);
    }
  </style>
</head>
<body>
  <main>
    <h1>Contraction-Watch</h1>
    <p class="muted">Labor timer for iPhone with an Apple Watch companion.</p>
    <p>Use the links below for the App Store support URL and privacy policy URL.</p>
    <div class="links">
      <a class="button" href="./support.html">Support</a>
      <a class="button secondary" href="./privacy.html">Privacy Policy</a>
    </div>
  </main>
</body>
</html>
