<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>排班闹钟</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #14212b;
      --muted: #586774;
      --line: #d5dee6;
      --brand: #235a88;
      --bg: #f3f7fb;
      --panel: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
    }

    main {
      width: min(880px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0;
    }

    header {
      border-bottom: 1px solid var(--line);
      margin-bottom: 28px;
      padding-bottom: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(32px, 7vw, 56px);
      line-height: 1.1;
    }

    p {
      margin: 0 0 14px;
    }

    a {
      color: var(--brand);
      font-weight: 700;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 28px;
    }

    .link {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }

    .muted {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>排班闹钟</h1>
      <p class="muted">面向轮班场景的本地排班与闹钟提醒工具。</p>
    </header>

    <p>排班闹钟支持维护排班模板、配置班次闹钟规则、设置到站提醒与补觉闹钟偏好。当前版本不提供账号登录，用户数据默认保存在设备本机。</p>

    <div class="links">
      <section class="link">
        <h2>隐私政策</h2>
        <p class="muted">查看应用如何处理排班与提醒相关数据。</p>
        <a href="./privacy.html">打开隐私政策</a>
      </section>
      <section class="link">
        <h2>支持</h2>
        <p class="muted">查看问题反馈方式和审核说明。</p>
        <a href="./support.html">打开支持页面</a>
      </section>
    </div>
  </main>
</body>
</html>
